name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3 builds natively; ubuntu-latest already ships
      # python3/make/g++, so no extra apt step is needed.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
